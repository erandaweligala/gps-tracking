name: gps_tracker
description: Background GPS tracker that reports location to the backend.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Free, open-source background location plugin (Android + iOS).
  background_locator_2: ^2.0.6
  # Runtime permission requests.
  permission_handler: ^11.3.1
  # HTTP client for posting locations to the backend.
  http: ^1.2.2
  # Local offline buffer (queue points while offline).
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
