services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: gps
      POSTGRES_PASSWORD: gps
      POSTGRES_DB: gps_tracking
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gps -d gps_tracking"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgres://gps:gps@db:5432/gps_tracking
      JWT_SECRET: dev-secret-change-me
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"

volumes:
  db_data:
